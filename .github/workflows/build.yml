name: Wireless Battery JP build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only by default: builds of pull requests cannot change the repository or releases.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Actions are pinned to exact commits so a moved tag cannot swap in different code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc make

      - name: Build WirelessBattery.exe
        shell: msys2 {0}
        run: make

      - name: Test Rapoo protocol and driver
        shell: msys2 {0}
        run: make test

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer and portable zip
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '0.0.0' }
          ./installer/build-installer.ps1 -Version $version

      - name: Fetch HeadsetControl source (GPL corresponding source for the bundled binary)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Sapd/HeadsetControl/releases/download/4.3.0/headsetcontrol-4.3.0.tar.gz -OutFile dist/headsetcontrol-4.3.0.tar.gz
          if ((Get-FileHash dist/headsetcontrol-4.3.0.tar.gz -Algorithm SHA256).Hash -ne '918dcacf8aef347744b36b2d259d76880fa64b3869f0f8ef26b6576b873d28a7') { throw 'checksum mismatch' }

      - name: Verify Japanese distribution and write SHA-256 checksums
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '0.0.0' }
          $required = @(
            "dist/WirelessBatteryJP-Setup-$version.exe",
            "dist/WirelessBatteryJP-$version-portable.zip",
            "dist/headsetcontrol-4.3.0.tar.gz"
          )
          foreach ($file in $required) { if (-not (Test-Path $file)) { throw "Required GPL distribution file missing: $file" } }
          $required | ForEach-Object {
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($_))"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          $zipEntries = tar -tf "dist/WirelessBatteryJP-$version-portable.zip"
          foreach ($name in 'LICENSE.txt','THIRD_PARTY_NOTICES.txt','README.md','CHANGELOG-JP.md','WirelessBattery.exe') {
            if (-not ($zipEntries -match "(^|/)$([regex]::Escape($name))$")) { throw "Portable package is missing $name" }
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WirelessBatteryJP
          path: dist/*

  # Only this job can publish, and only for version tags pushed by the maintainer.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-jp.')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: WirelessBatteryJP
          path: dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          body: |
            ## Wireless Battery JP

            非公式日本語版のリリースです。インストール前に `SHA256SUMS.txt` で配布物を検証してください。

            実機未検証のデバイスは動作確認済みではありません。詳細、既知の制限、GPL-3.0-or-laterの条件はREADMEと同梱文書を参照してください。
